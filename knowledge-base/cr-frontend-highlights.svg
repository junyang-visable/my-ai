    <text x="1255" y="524" font-size="17" font-weight="700" fill="#0f172a">8.4 SSR Safety</text>
    <line x1="1255" y1="536" x2="1580" y2="536" stroke="#e2e8f0"/>
    <text x="1255" y="560" font-size="13" fill="#334155">· 调用链追踪穿透 re-export，非表面扫描</text>
    <text x="1255" y="586" font-size="13" fill="#334155">· 只查 app/helper 调用，排除框架 API</text>
    <text x="1255" y="612" font-size="13" fill="#334155">· 直接 window 归 Step 7 · 间接链不双报</text>
    <text x="1255" y="638" font-size="13" fill="#334155">· Phase 1 非空 → Phase 2 强制执行</text>
