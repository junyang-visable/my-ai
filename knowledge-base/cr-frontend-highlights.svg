  <!-- 支柱 A -->
  <g>
    <rect x="80" y="764" width="490" height="356" rx="14" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.4"/>
    <text x="100" y="806" font-size="18" font-weight="700" fill="#7c3aed">A · 事故驱动的方法论</text>
    <text x="100" y="830" font-size="12.5" fill="#64748b">每条规则锚定真实 Jira 事故（FE-784 / FE-829 / FE-896）</text>
    <line x1="100" y1="846" x2="550" y2="846" stroke="#e2e8f0"/>
    <text x="100" y="874" font-size="13" fill="#334155">· 没改埋点文件 ≠ 没改埋点行为 → 扫描点击 / DOM / 可见性等间接信号</text>
    <text x="100" y="912" font-size="13" fill="#334155">· 埋点契约清单逐条比对 diff：受保护事件被破坏就拦截</text>
    <text x="100" y="950" font-size="13" fill="#334155">· SSR 风险追调用链：穿透 re-export 找出隐藏的浏览器 API</text>
    <text x="100" y="988" font-size="13" fill="#334155">· 每个评估写明边界：做什么、不做什么、归谁管（Cypress 归 CI）</text>
    <line x1="100" y1="1050" x2="550" y2="1050" stroke="#e2e8f0"/>
    <text x="100" y="1076" font-size="11" fill="#64748b">代表文件：references/assessments/* · references/seo/*</text>
  </g>

  <!-- 支柱 B -->
  <g>
    <rect x="595" y="764" width="490" height="356" rx="14" fill="#ffffff" stroke="#fdba74" stroke-width="1.4"/>
    <text x="615" y="806" font-size="18" font-weight="700" fill="#ea580c">B · LLM 行为防御</text>
    <text x="615" y="830" font-size="12.5" fill="#64748b">对抗已知失败模式：走过场、静默通过、一气呵成</text>
    <line x1="615" y1="846" x2="1065" y2="846" stroke="#e2e8f0"/>
    <text x="615" y="874" font-size="13" fill="#334155">· SEO / SSR 评估必须产出确认项：禁止用「无影响」总结跳过人工确认</text>
    <text x="615" y="912" font-size="13" fill="#334155">· 20+ 条打回规则：误分类、贴错标签、模板外加戏，一律打回重做</text>
    <text x="615" y="950" font-size="13" fill="#334155">· 默认动手修：普通 review 请求 ≠ 只报告，明确说 review only 才只读</text>
    <text x="615" y="988" font-size="13" fill="#334155">· 有确认项必须停下等回复：沉默 ≠ 同意，不能替用户假设「不用改」</text>
    <text x="615" y="1026" font-size="13" fill="#334155">· 强制复审闭环 + 最多 2 轮，防死循环也防烂尾</text>
    <line x1="615" y1="1050" x2="1065" y2="1050" stroke="#e2e8f0"/>
    <text x="615" y="1076" font-size="11" fill="#64748b">代表文件：references/workflows/fix-workflow.md（Error Handling 表 20+ 项）</text>
  </g>

  <!-- 支柱 C -->
  <g>
    <rect x="1110" y="764" width="490" height="356" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
    <text x="1130" y="806" font-size="18" font-weight="700" fill="#2563eb">C · 输出工程 &amp; 可维护性</text>
    <text x="1130" y="830" font-size="12.5" fill="#64748b">人机协作的输出契约与渐进加载的文件组织</text>
    <line x1="1130" y1="846" x2="1580" y2="846" stroke="#e2e8f0"/>
    <text x="1130" y="874" font-size="13" fill="#334155">· 分阶段输出：先给修复确认清单，确认后再给完整报告</text>
    <text x="1130" y="912" font-size="13" fill="#334155">· 统一标签路由：所有评估发现汇入同一份严重度列表，下游只认标签</text>
    <text x="1130" y="950" font-size="13" fill="#334155">· 项目级覆盖：projects/ 下加一个 md，即可追加仓库专属高风险规则</text>
    <text x="1130" y="988" font-size="13" fill="#334155">· 渐进加载：SKILL.md 仅编排，规则文件按需读取，控制 token 成本</text>
    <line x1="1130" y1="1050" x2="1580" y2="1050" stroke="#e2e8f0"/>
    <text x="1130" y="1076" font-size="11" fill="#64748b">代表文件：SKILL.md · references/templates/* · projects/*</text>
  </g>

