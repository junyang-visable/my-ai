    <text x="485" y="560" font-size="13" fill="#334155">· rollout / flag 退役 PR 自动触发</text>
    <text x="485" y="586" font-size="13" fill="#334155">· 9 类残留全仓 grep：常量/分支/追踪/测试/i18n</text>
    <text x="485" y="612" font-size="13" fill="#334155">· flag 仍活跃 → 中止评估</text>
    <text x="485" y="638" font-size="13" fill="#334155">· 分支删除影响 100% 流量</text>
    <line x1="485" y1="658" x2="810" y2="658" stroke="#e2e8f0"/>
    <text x="485" y="682" font-size="11" font-weight="700" fill="#ea580c">[experiment-cleanup]</text>
