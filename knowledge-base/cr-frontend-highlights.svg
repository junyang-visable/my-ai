    <text x="100" y="524" font-size="17" font-weight="700" fill="#0f172a">8.1 Tracking Assessment</text>
    <line x1="100" y1="536" x2="425" y2="536" stroke="#e2e8f0"/>
    <text x="100" y="560" font-size="13" fill="#334155">· 行为扫描 + FE-784 间接信号（点击/DOM/可见性）</text>
    <text x="100" y="586" font-size="13" fill="#334155">· SSOT 契约守卫：ga3/{page}.json 保护清单比对</text>
    <text x="100" y="612" font-size="13" fill="#334155">· 三级 fallback 取数，强制披露 source</text>
    <text x="100" y="638" font-size="13" fill="#334155">· 契约违规 &gt; 行为发现，自动去重</text>
    <line x1="100" y1="658" x2="425" y2="658" stroke="#e2e8f0"/>
    <text x="100" y="682" font-size="11" font-weight="700" fill="#7c3aed">[tracking-impact] [defensive-tracking-contract]</text>
  </g>

