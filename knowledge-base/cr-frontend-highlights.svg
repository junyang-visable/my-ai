  <rect x="80" y="388" width="5" height="22" rx="2.5" fill="#7c3aed"/>
  <text x="96" y="406" font-size="17" font-weight="700" fill="#0f172a">② Step 8 评估注册表 — registry-driven</text>
  <text x="96" y="430" font-size="13" fill="#64748b">扩展协议：新增评估 = 新建 reference 文件 + 注册表加一行 · 下游 Steps 9–12 永不改动 · 所有发现统一路由到三级严重度列表</text>

