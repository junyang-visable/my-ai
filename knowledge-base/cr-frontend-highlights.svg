  <g>
    <rect x="80" y="448" width="365" height="248" rx="14" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.4"/>
    <rect x="100" y="468" width="96" height="24" rx="12" fill="#7c3aed"/>
