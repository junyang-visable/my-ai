<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>drawio verify</title>
    <style>
      body {
        margin: 0;
        background: #fff;
      }
      iframe {
        width: 1280px;
        height: 720px;
        border: 0;
        display: block;
      }
      #log {
        position: fixed;
        top: 0;
        right: 0;
        background: #c8f7c5;
        padding: 2px 8px;
        font: 12px monospace;
        z-index: 9;
      }
    </style>
  </head>
  <body>
    <div id="log">loading...</div>
    <iframe id="v"></iframe>
    <script>
      (async () => {
        // 绝对路径：本页可部署在任意子目录（如 skill scripts/），tmp 文件固定在工作区根
        const xml = await (await fetch("/tmp-verify.drawio")).text();
        // 对齐 drawio Graph.compress：encodeURIComponent -> deflate-raw -> base64
        const data = new TextEncoder().encode(encodeURIComponent(xml));
        const stream = new Blob([data])
          .stream()
          .pipeThrough(new CompressionStream("deflate-raw"));
        const buf = new Uint8Array(await new Response(stream).arrayBuffer());
        let bin = "";
        buf.forEach((b) => {
          bin += String.fromCharCode(b);
        });
        document.getElementById("log").textContent = "xml chars: " + xml.length;
        document.getElementById("v").src =
          "https://viewer.diagrams.net/#R" + btoa(bin);
      })();
    </script>
  </body>
</html>
