# =============================================================================
# skill-routes.yaml — 增强技能路由配置模板（全集）
# -----------------------------------------------------------------------------
# 用法：复制本文件为 kit 根的 skill-routes.local.yaml（已 gitignore，纯本地
# 个人配置，不入库），把想启用的阶段键从 null 改为技能名即可。
#
# 规则：
#   1. 键留 null 或整段缺失 → 走该技能的默认逻辑
#   2. 配置了技能名，但该技能不在当前会话可用技能清单里（技能是环境注入的，
#      文件在 ≠ 会话里有）→ 静默跳过走默认逻辑，不报错、不打断
#   3. 值可以是单个技能名，或列表（多个时按序尝试，全部不可用才走默认）
#   4. 换环境（Qoder / Claude Code / superpowers）技能名可能不同，
#      写名字前先确认当前环境里它真的叫这个
#   5. harness-dev（纯调度）与 harness-testing（角色隔离）不参与增强路由
# =============================================================================

harness-spec:
  澄清追问: null       # 触发：需求模糊需要逼问时（默认：苏格拉底式自问——目标用户/成功标准/明确不做/边界条件/失败态）例: grilling
  方案发散: null       # 触发：方案思路打不开、想比较多种设计时（默认：自己列方案对比）例: design-an-interface

harness-plan:
  方案存疑: null       # 触发：计划某步的设计/状态模型拿不准时（默认：写进 plan 风险栏）例: prototype

harness-coding:
  诊断: null           # 触发：同一错误连续多轮无进展、拿不准根因时（默认：needs_human 三态退出）例: diagnosing-bugs

harness-change:
  变更追问: null       # 触发：变更口径模糊、新旧 spec 差异说不清时（默认：对照差异自问）例: grilling
