# =============================================================================
# skill-routes.yaml — enhanced skill-routing config template (full set)
# -----------------------------------------------------------------------------
# Usage: copy this file to skill-routes.local.yaml at the kit root (already
# gitignored — purely local personal config, never committed) and change the
# stage keys you want from null to a skill name.
#
# Rules:
#   1. key null or the whole block missing → the skill's default logic runs
#   2. a skill name is configured, but that skill is not in the current
#      session's available-skills list (skills are environment-injected —
#      file exists ≠ available in session) → silently fall back to default
#      logic: no errors, no interruptions
#   3. the value may be a single skill name or a list (tried in order; fall
#      back only when all are unavailable)
#   4. skill names differ across environments (Qoder / Claude Code /
#      superpowers) — confirm the name actually exists in the current
#      environment before writing it
#   5. harness-dev (pure dispatch) and harness-testing (role isolation) do
#      not participate in enhanced routing
# =============================================================================

harness-spec:
  clarify: null            # trigger: vague requirement needs grilling (default: Socratic self-questioning — target users / success criteria / explicit non-goals / boundary conditions / failure states) e.g. grilling
  explore-approaches: null # trigger: approach ideas won't open up, want to compare designs (default: list and compare approaches yourself) e.g. design-an-interface

harness-plan:
  approach-uncertain: null # trigger: unsure about a step's design/state model (default: write it into the plan's risk column) e.g. prototype

harness-coding:
  diagnosis: null          # trigger: same error stuck for multiple rounds, unsure of the root cause (default: needs_human three-way exit) e.g. diagnosing-bugs

harness-change:
  change-grill: null       # trigger: change intent vague, old-vs-new spec difference unclear (default: self-question against the diff) e.g. grilling
